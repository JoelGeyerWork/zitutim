# A throwaway OpenLDAP for exercising src/lib/ldap.ts against a real directory.
#
# Deliberately a separate file from docker-compose.yml so `npm run db:up` does
# not start a directory server nobody asked for. Start it with `npm run ldap:up`.
#
# This is NOT Active Directory. It covers the two-bind flow, RFC 4515 escaping,
# LDAPS, the empty-password guard and the throttle. It cannot cover objectGUID
# byte order or the AD error sub-codes — those need a real AD (or Samba).
services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: zitutim-ldap
    # The certificate is issued for "localhost", and hostname verification is
    # against the name the client dials — which is localhost, via the published
    # port below.
    hostname: localhost
    command: ["--copy-service"]
    environment:
      LDAP_ORGANISATION: "Zitutim Dev"
      LDAP_DOMAIN: "test.local"
      LDAP_ADMIN_PASSWORD: "admin-password"
      LDAP_TLS_CRT_FILENAME: "cert.pem"
      LDAP_TLS_KEY_FILENAME: "key.pem"
      LDAP_TLS_CA_CRT_FILENAME: "ca.pem"
      # Without this the server demands a client certificate and the TLS
      # handshake dies as an opaque ECONNRESET.
      LDAP_TLS_VERIFY_CLIENT: "never"
    ports:
      # 1636 rather than 636 so it needs no privileged port on the host.
      - "1636:636"
    # The port is bound well before slapd has finished loading the bootstrap
    # LDIF, so "the socket accepts" is not "the directory answers". `ldap:up`
    # passes --wait, which blocks on this rather than on the port.
    #
    # Three things make this check what it is:
    #  - ldaps://636, not plain 389. The image generates DH parameters *after*
    #    389 starts answering, and until that finishes every TLS handshake dies
    #    as an opaque ECONNRESET. Checking 389 reports ready far too early.
    #  - bound as admin, because an anonymous search returns "no such object"
    #    (32) even for entries that exist — OpenLDAP hides existence from
    #    readers who can't see them, so this would never go green.
    #  - looking for a seeded user, which only appears once the bootstrap LDIF
    #    has actually loaded.
    healthcheck:
      test:
        - CMD-SHELL
        - LDAPTLS_REQCERT=never ldapsearch -x -H ldaps://localhost:636 -D cn=admin,dc=test,dc=local -w admin-password -b dc=test,dc=local '(uid=dana)' dn 2>/dev/null | grep -q '^dn:'
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    volumes:
      # Generated by `npm run ldap:certs`. The certificate baked into this image
      # expired in January 2026, so supplying our own is not optional.
      - ./.ldap/certs:/container/service/slapd/assets/certs:ro
      - ./ldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d

volumes:
  ldap-data:
  ldap-config:
