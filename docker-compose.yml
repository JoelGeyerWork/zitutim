services:
  mongo:
    image: mongo:8
    container_name: zitutim-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    # Behind a profile so `npm run db:up` (plain `docker compose up -d`) still
    # starts Mongo alone for the usual `npm run dev` workflow. The whole stack
    # is `docker compose --profile app up -d`.
    profiles: ["app"]
    build:
      context: .
    container_name: zitutim-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Both are fixed here rather than read from .env.local, which Compose
      # never loads: its localhost:27017 is wrong inside the network anyway, and
      # an interpolated ${MONGODB_DB} would quietly fall back to the default
      # while the host-side seed scripts wrote somewhere else. To use a
      # different database, change it here as well.
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: zitutim
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
