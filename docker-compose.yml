services:
  mongo:
    image: mongo:8
    container_name: zitutim-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    # Behind a profile so `npm run db:up` (plain `docker compose up -d`) still
    # starts Mongo alone for the usual `npm run dev` workflow. The whole stack
    # is `docker compose --profile app up -d`.
    profiles: ["app"]
    build:
      context: .
    container_name: zitutim-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    # SESSION_SECRET and the LDAP_* block, straight from the file the host
    # tooling already uses. Naming the file here is what makes it work: Compose
    # only auto-loads `.env`, and only for `${...}` interpolation — `env_file`
    # is a different mechanism that reads whatever path it is given and hands
    # the result to the container.
    #
    # It also means no secret is written into this file or baked into the image,
    # and that a missing .env.local fails `app:up` outright instead of building
    # a container that starts healthy and cannot be logged into. Note that
    # LDAP_TLS_CA is a *host* path: point it at a mounted one, or leave it unset
    # and rely on LDAP_TLS_INSECURE.
    env_file:
      - .env.local
    environment:
      # Wins over env_file, deliberately. .env.local's MONGODB_URI is
      # localhost:27017, which inside the network is the container itself, and
      # an interpolated ${MONGODB_DB} would quietly fall back to the default
      # while the host-side seed scripts wrote somewhere else. To use a
      # different database, change it here as well.
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: zitutim
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
